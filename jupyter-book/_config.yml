#######################################################################################
# Book settings
title : Machine learning with scikit-learn
author: Marcin Sawiński, Poznań University of Economics and Business
logo: 'uep-logo.svg'
copyright: "2022-2024 Inria and scikit-learn developers; 2026 adaptation by Marcin Sawiński"

# Information about where the book exists on the web
description: >-
  Machine learning with scikit-learn, Poznań University of Economics and
  Business. Adapted from the Inria scikit-learn MOOC.
exclude_patterns:
  -  _build
  - Thumbs.db
  - .DS_Store
  - "**.ipynb_checkpoints"
  - "figures"
  - "datasets"
  - "README.md"
  - "workbooks/README.md"


#######################################################################################
# Execution settings
execute:
  execute_notebooks           : cache
  timeout                     : 300
  # Student workbooks stop at their first gap (____) by design: show them
  # without running them.
  exclude_patterns:
    - "workbooks/*"

#######################################################################################
# Parse and render settings
parse:
  myst_enable_extensions:
    - colon_fence
    - dollarmath
    - linkify
    - substitution

#######################################################################################
# HTML-specific settings
html:
  home_page_in_navbar         : false
  use_edit_page_button        : true
  use_repository_button       : true
  use_issues_button           : true
  favicon: _static/favicon.ico
  comments:
    hypothesis: true
  extra_footer: |
    <div>
      Course material for
      <a href="https://ue.poznan.pl/">Poznań University of Economics and Business</a>,
      adapted by Marcin Sawiński.
      <br>
      Based on the <a href="https://inria.github.io/scikit-learn-mooc/">scikit-learn MOOC</a>
      by <a href="https://learninglab.inria.fr">Inria Learning Lab</a>,
      <a href="https://scikit-learn.fondation-inria.fr">scikit-learn @ La Fondation Inria</a>,
      <a href="https://www.inria-academy.fr/formation/scikit-learn-la-boite-a-outils-de-lapprentissage-automatique/">Inria Academy</a>
      and <a href="https://probabl.ai/">probabl</a>, with many thanks to the
      <a href="https://scikit-learn.org">scikit-learn</a> community,
      used under a <a href="https://github.com/INRIA/scikit-learn-mooc/blob/main/LICENSE">CC-BY License</a>.
      Changes: Google Colab links, additional workbooks and exercises.
    </div>

# #######################################################################################
# Interact link settings
notebook_interface            : "notebook"
# notebook_interface: "classic" # The interface interactive links will activate ["classic", "jupyterlab"]

sphinx:
  config:
    nb_custom_formats:
      .py:
        - jupytext.reads
        - fmt: py:percent
    # Needed for plotly rendering:
    # https://jupyterbook.org/interactive/interactive.html#plotly
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js

#######################################################################################
# Launch button settings
repository:
  url                         : https://github.com/marcinsawinski/scikit-learn-mooc
  branch: main

launch_buttons:
  binderhub_url: "https://mybinder.org"
  # The generated link points to python_scripts/*.py; _static/sklearn_mooc.js
  # rewrites it to the matching notebooks/*.ipynb, which Colab can open.
  colab_url: "https://colab.research.google.com"
#  Disable thebe support since it does not start in the right folder, see
#  https://github.com/INRIA/scikit-learn-mooc/issues/669 for more details
#  thebe: true

binder:
  binderhub_url               : "https://mybinder.org"
  text                        : "Launch binder"


latex:
  latex_engine                : "xelatex"
  latex_documents:
    targetname: book.tex
